version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:30"
      timezone: "Europe/London"
    groups:
      actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "10:30"
      timezone: "Europe/London"
    groups:
      docker-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
